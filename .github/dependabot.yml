version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # The application currently qualifies python-ulid below major version 4.
      - dependency-name: "python-ulid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/agent-windows"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python-ulid"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/installer/server-linux"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # Keep Python on its qualified minor series; allow patch refreshes.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
